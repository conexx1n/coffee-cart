<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кафе на колесах</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; background: #1b1d24; color: #eee; font-family: system-ui, sans-serif; }
  #hud { padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  #hud b { color: #ffd166; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 12px; }
  button { background: #2f3445; color: #eee; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button.active { background: #ffd166; color: #222; }
  button:disabled { opacity: 0.4; cursor: default; }
  canvas { display: block; width: 100%; max-width: 800px; margin: 8px auto; background: #242836; border-radius: 10px; }
  #log { min-height: 22px; padding: 4px 12px; color: #06d6a0; font-size: 14px; }
</style>
</head>
<body>
<div id="hud">
  <span>Деньги: <b id="money">0</b></span>
  <span>День: <b id="day">1</b></span>
  <span>Район: <b id="district">Центр</b></span>
  <span>Очередь: <b id="queue">0</b>/<span id="maxq">4</span></span>
  <span>Репутация: <b id="rep">50</b></span>
</div>
<div class="row">
  <button id="beanCheap">Эконом (8)</button>
  <button id="beanPremium">Премиум (16)</button>
  <button id="d0">Центр</button>
  <button id="d1">Вокзал (100)</button>
  <button id="d2">Парк (200)</button>
</div>
<div class="row">
  <button id="upMachine">Кофемашина</button>
  <button id="upQueue">Место в очереди</button>
</div>
<canvas id="c" width="800" height="360"></canvas>
<div id="log"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// --- состояние ---
let money = 0, rep = 50, day = 1, dayTime = 0;
let machine = 1, maxQueue = 4;
let beans = 'cheap';
let district = 0;
const districts = [
  { name: 'Центр',  spawn: 4, priceMul: 1.0, unlocked: true,  cost: 0 },
  { name: 'Вокзал', spawn: 3, priceMul: 1.3, unlocked: false, cost: 100 },
  { name: 'Парк',   spawn: 6, priceMul: 1.1, unlocked: false, cost: 200 },
];
const types = [
  { name: 'обычный',  color: '#8ecae6', patience: 0.05, price: 1.0, weight: 5 },
  { name: 'торопыга', color: '#ef476f', patience: 0.10, price: 1.0, weight: 2 },
  { name: 'турист',   color: '#ffd166', patience: 0.03, price: 2.0, weight: 1 },
  { name: 'критик',   color: '#b388eb', patience: 0.04, price: 0.5, weight: 1, repBonus: 3 },
];

let customers = [];
let cooking = null, cookTimer = 0;
let spawnTimer = 0, eventTimer = 0;
let rainLeft = 0;

const logEl = document.getElementById('log');
const say = msg => logEl.textContent = msg;
const beanCost = () => beans === 'cheap' ? 8 : 16;
const machineCost = () => 50 * machine;
const queueCost = () => 80 * (maxQueue - 3);

function randomType() {
  const total = types.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of types) { r -= t.weight; if (r <= 0) return t; }
  return types[0];
}

function spawn(count = 1) {
  for (let i = 0; i < count; i++) {
    if (customers.length >= maxQueue) return;
    customers.push({ x: 0, t: randomType(), patience: 1, served: false });
  }
}

function layoutQueue() {
  customers.forEach((c, i) => c.x = 760 - i * 90);
}

// --- события ---
const events = [
  { name: 'Жара: молоко портится, один клиент уходит',
    run() { const c = customers.find(x => !x.served); if (c) c.patience = 0; } },
  { name: 'Проверка СЭС: штраф 30',
    run() { if (money >= 30) { money -= 30; say('Заплатил штраф 30'); } else { rep = Math.max(0, rep - 10); say('Нечем платить, репутация падает'); } } },
  { name: 'Туристический автобус: толпа гостей!',
    run() { spawn(3); } },
  { name: 'Дождь: клиентов меньше на время',
    run() { rainLeft = 15; } },
];

// --- сохранение ---
const SAVE_KEY = 'coffee-cart-save';
function saveState() {
  const data = JSON.stringify({ money, rep, day, machine, maxQueue, beans, district,
    unlocked: districts.map(d => d.unlocked) });
  try {
    if (tg && tg.CloudStorage) tg.CloudStorage.setItem(SAVE_KEY, data);
    else localStorage.setItem(SAVE_KEY, data);
  } catch (e) {}
}
function applyState(s) {
  if (!s) return;
  money = s.money ?? money; rep = s.rep ?? rep; day = s.day ?? day;
  machine = s.machine ?? machine; maxQueue = s.maxQueue ?? maxQueue;
  beans = s.beans ?? beans; district = s.district ?? district;
  if (s.unlocked) s.unlocked.forEach((u, i) => districts[i].unlocked = u);
}
function loadState() {
  return new Promise(resolve => {
    try {
      if (tg && tg.CloudStorage) {
        tg.CloudStorage.getItem(SAVE_KEY, (err, val) => {
          resolve(!err && val ? JSON.parse(val) : null);
        });
      } else {
        const v = localStorage.getItem(SAVE_KEY);
        resolve(v ? JSON.parse(v) : null);
      }
    } catch (e) { resolve(null); }
  });
}
setInterval(saveState, 5000);

// --- управление ---
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (cv.width / r.width);
  const my = (e.clientY - r.top) * (cv.height / r.height);
  for (const c of customers) {
    if (!c.served && Math.abs(mx - c.x) < 35 && my > 120 && my < 230) {
      if (cooking === null) { cooking = c; cookTimer = 0; }
      return;
    }
  }
});

document.getElementById('beanCheap').onclick = () => { beans = 'cheap'; };
document.getElementById('beanPremium').onclick = () => { beans = 'premium'; };
[0, 1, 2].forEach(i => document.getElementById('d' + i).onclick = () => {
  const d = districts[i];
  if (!d.unlocked && money >= d.cost) { money -= d.cost; d.unlocked = true; }
  if (d.unlocked) { district = i; say('Переехал в район: ' + d.name); }
});
document.getElementById('upMachine').onclick = () => {
  if (money >= machineCost()) { money -= machineCost(); machine++; }
};
document.getElementById('upQueue').onclick = () => {
  if (money >= queueCost() && maxQueue < 8) { money -= queueCost(); maxQueue++; }
};

// --- цикл ---
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  dayTime += dt;
  if (dayTime > 90) { dayTime = 0; day++; say('Новый день: ' + day); }

  const d = districts[district];
  const rainMul = rainLeft > 0 ? 0.4 : 1;
  if (rainLeft > 0) rainLeft -= dt;

  spawnTimer += dt;
  if (spawnTimer > d.spawn / rainMul) { spawn(1); spawnTimer = 0; }

  eventTimer += dt;
  if (eventTimer > 20) {
    eventTimer = 0;
    const ev = events[Math.floor(Math.random() * events.length)];
    say(ev.name);
    ev.run();
  }

  const beanMul = beans === 'premium' ? 0.6 : 1;
  for (const c of customers) if (!c.served) c.patience -= dt * c.t.patience * beanMul;

  customers.forEach(c => {
    if (!c.served && c.patience <= 0) { rep = Math.max(0, rep - 2); c.gone = true; }
  });
  customers = customers.filter(c => !c.gone);
  if (cooking && cooking.gone) cooking = null;
  layoutQueue();

  if (cooking) {
    cookTimer += dt * (0.6 + machine * 0.3);
    if (cookTimer >= 1) {
      const base = 10 + machine * 2;
      money += Math.round(base * cooking.t.price * d.priceMul);
      rep = Math.min(100, rep + (cooking.t.repBonus || 1));
      cooking.served = true;
      cooking = null;
      customers = customers.filter(c => !c.served);
      layoutQueue();
    }
  }

  draw();
  updateHud();
  requestAnimationFrame(loop);
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);

  ctx.fillStyle = '#2b3042';
  ctx.fillRect(0, 0, cv.width, 90);
  ctx.fillStyle = '#eee';
  ctx.font = '16px system-ui';
  ctx.fillText('Район: ' + districts[district].name + (rainLeft > 0 ? '  (дождь)' : ''), 16, 26);

  ctx.fillStyle = '#5c4033';
  ctx.fillRect(40, 260, 200, 60);
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(40, 250, 200, 12);
  ctx.fillStyle = '#ffd166';
  ctx.font = '14px system-ui';
  ctx.fillText('Кофе-тележка', 60, 298);

  for (const c of customers) {
    ctx.fillStyle = c.t.color;
    ctx.beginPath();
    ctx.arc(c.x, 180, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#eee';
    ctx.font = '12px system-ui';
    ctx.fillText(c.t.name, c.x - 26, 224);
    ctx.fillStyle = '#444';
    ctx.fillRect(c.x - 25, 118, 50, 6);
    ctx.fillStyle = c.patience > 0.3 ? '#06d6a0' : '#ef476f';
    ctx.fillRect(c.x - 25, 118, 50 * Math.max(c.patience, 0), 6);
  }

  ctx.fillStyle = '#333';
  ctx.fillRect(250, 335, 300, 14);
  ctx.font = '14px system-ui';
  if (cooking) {
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(250, 335, 300 * Math.min(cookTimer, 1), 14);
    ctx.fillStyle = '#eee';
    ctx.fillText('Готовлю кофе...', 250, 328);
  } else {
    ctx.fillStyle = '#aaa';
    ctx.fillText('Нажми на клиента, чтобы начать заказ', 250, 328);
  }
}

function updateHud() {
  document.getElementById('money').textContent = Math.floor(money);
  document.getElementById('day').textContent = day;
  document.getElementById('district').textContent = districts[district].name;
  document.getElementById('queue').textContent = customers.length;
  document.getElementById('maxq').textContent = maxQueue;
  document.getElementById('rep').textContent = Math.floor(rep);

  document.getElementById('beanCheap').textContent = 'Эконом (8)';
  document.getElementById('beanPremium').textContent = 'Премиум (16)';
  document.getElementById('beanCheap').classList.toggle('active', beans === 'cheap');
  document.getElementById('beanPremium').classList.toggle('active', beans === 'premium');
  [0, 1, 2].forEach(i => {
    const b = document.getElementById('d' + i);
    b.classList.toggle('active', district === i);
    b.disabled = !districts[i].unlocked && money < districts[i].cost;
  });

  document.getElementById('upMachine').textContent = 'Кофемашина (' + machineCost() + ')';
  document.getElementById('upMachine').disabled = money < machineCost();
  document.getElementById('upQueue').textContent = maxQueue < 8 ? 'Место в очереди (' + queueCost() + ')' : 'Очередь максимум';
  document.getElementById('upQueue').disabled = money < queueCost() || maxQueue >= 8;
}

loadState().then(s => {
  applyState(s);
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
