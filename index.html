<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Cart</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1e1510;--card:#2d2018;--line:#4a3426;--cream:#f6e7d0;--gold:#f2b24a;--mint:#7bd8a4;--red:#e8453a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:8px 10px calc(16px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brand{font-size:18px;font-weight:700;color:var(--gold)}
#acc{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:13px;max-width:60%}
#accName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ava{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#2a1a0c;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
#ava img{width:100%;height:100%;object-fit:cover}
#hud{display:flex;gap:8px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px}
.stat b{display:block;font-size:19px;color:var(--gold)}
#nav{display:flex;gap:6px;margin:10px 0 8px}
#nav button{flex:1;padding:10px 6px}
#dayInfo{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
#dayInfo b{color:var(--gold)}
#bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin-bottom:8px}
#barFill{display:block;height:100%;width:0;background:var(--gold)}
canvas{width:100%;display:block;border-radius:16px;margin:0 0 8px;border:1px solid var(--line);touch-action:manipulation}
#log{min-height:20px;font-size:13px;color:var(--mint)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
button{font:inherit;color:var(--cream);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
button.on{background:var(--gold);color:#2a1a0c;border-color:var(--gold);font-weight:700}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#items,#board{display:grid;gap:6px;margin-top:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.item .i{font-size:26px}
.item .t{flex:1;font-size:14px}
.item .t small{display:block;opacity:.65;font-size:12px;margin-top:2px}
.rank{width:26px;text-align:center;font-weight:700;color:var(--gold)}
.item.me{border-color:var(--gold);background:#3a2a1e}
.score{font-weight:700;color:var(--gold)}
.note{font-size:12px;opacity:.6;margin-top:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
#mcard{background:var(--card);border:1px solid var(--gold);border-radius:18px;padding:18px;width:min(100%,420px)}
#mcard h2{margin:0 0 12px;font-size:20px;color:var(--gold)}
.mrow{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;border-bottom:1px solid var(--line)}
.mrow.sub{font-size:13px;opacity:.85}
.mrow.tot{font-size:18px;border:0;padding-top:10px}
.pos{color:var(--mint)}.neg{color:var(--red)}
#mcard .warn{color:var(--red);font-size:13px;margin-top:8px}
#mcard button{width:100%;margin-top:14px;padding:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">☕ Coffee Cart</div>
    <div id="acc"><span id="accName">Гость</span><span id="ava">?</span></div>
  </header>
  <div id="hud">
    <div class="stat">Деньги<b id="money">0</b></div>
    <div class="stat">День<b id="day">1</b></div>
    <div class="stat">Репутация<b id="rep">50</b></div>
    <div class="stat">Очередь<b id="queue">0</b></div>
  </div>
  <nav id="nav">
    <button data-view="game" class="on">🎮 Игра</button>
    <button data-view="shop">🛍️ Магазин</button>
    <button data-view="board">🏆 Лидерборд</button>
  </nav>
  <section id="v-game">
    <div id="dayInfo"><span>Выручка дня: <b id="dayRev">0</b></span><span id="dayLeft"></span></div>
    <div id="bar"><i id="barFill"></i></div>
    <canvas id="c" width="480" height="520"></canvas>
    <div id="log"></div>
  </section>
  <section id="v-shop" hidden>
    <div id="tabs"></div>
    <div id="items"></div>
  </section>
  <section id="v-board" hidden>
    <div id="board"></div>
    <div class="note">Пока это демо-рейтинг: рядом с тобой боты, настоящий список игроков появится, когда подключим сервер</div>
  </section>
  <div id="modal" hidden><div id="mcard"></div></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 480, H = 520, SIDE = 372, ROAD = 476, DAY_LEN = 90;
const $ = id => document.getElementById(id);

// ---------- аккаунт ----------
const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const myName = user ? (user.first_name || user.username || 'Игрок') : 'Гость';
$('accName').textContent = myName;
if (user && user.photo_url) { const im = document.createElement('img'); im.src = user.photo_url; im.alt = ''; $('ava').textContent = ''; $('ava').appendChild(im); }
else $('ava').textContent = myName[0].toUpperCase();

// ---------- данные ----------
const SKINS = ['#ffdbac', '#f1c27d', '#c68642', '#8d5524', '#5c3a21'];
const HATS = ['#e8b84a', '#e86a5a', '#5ab0e8', '#7bd8a4', '#f2f2f2'];
const TYPES = [
  { k: 'office',  name: 'Офисный',  w: 5,   pat: .05, price: 1 },
  { k: 'rush',    name: 'Торопыга', w: 2,   pat: .10, price: 1 },
  { k: 'tourist', name: 'Турист',   w: 1.5, pat: .03, price: 2 },
  { k: 'critic',  name: 'Критик',   w: 1,   pat: .04, price: .5, rep: 3 }
];
const DIST = [
  { name: 'Центр',  spawn: 4, mul: 1.0, cost: 0,   rent: 20, sky: ['#f6c58a', '#e8836b'], far: '#7a4a4a' },
  { name: 'Вокзал', spawn: 3, mul: 1.3, cost: 100, rent: 45, sky: ['#9cc4e8', '#e6d9c4'], far: '#55637a' },
  { name: 'Парк',   spawn: 6, mul: 1.1, cost: 200, rent: 35, sky: ['#b8e0a0', '#f2e6a8'], far: '#3f7a4a' }
];
const ITEMS = [
  { id: 'machine', cat: 'eq',    icon: '⚙️', name: 'Кофемашина',      desc: 'Кофе быстрее, но растет счет за электричество', max: 8, cost: l => 50 * (l + 1) },
  { id: 'queue',   cat: 'eq',    icon: '🧍', name: 'Место в очереди', desc: 'Больше клиентов в очереди', max: 4, cost: l => 80 * (l + 1) },
  { id: 'helper',  cat: 'eq',    icon: '🧑‍💼', name: 'Помощник',        desc: 'Сам берет заказы, зарплата 12 в день', max: 3, cost: l => 150 * (l + 1) },
  { id: 'awning',  cat: 'decor', icon: '⛱️', name: 'Навес',           desc: '+10% к цене кофе',          max: 3, cost: l => 120 * (l + 1) },
  { id: 'sign',    cat: 'decor', icon: '💡', name: 'Вывеска',         desc: 'Клиенты приходят чаще',     max: 3, cost: l => 100 * (l + 1) },
  { id: 'music',   cat: 'decor', icon: '🎵', name: 'Музыка',          desc: 'Клиенты терпеливее',        max: 3, cost: l => 90 * (l + 1) },
  { id: 'gold',    cat: 'vip',   icon: '🥇', name: 'Золотая кофемашина', desc: '+25% к цене кофе за уровень', max: 3, cost: l => 800 * (l + 1) },
  { id: 'ads',     cat: 'vip',   icon: '📣', name: 'Реклама в соцсетях', desc: 'Клиенты приходят намного чаще', max: 3, cost: l => 700 * (l + 1) },
  { id: 'lease',   cat: 'vip',   icon: '📜', name: 'Выкуп места',        desc: 'Аренда дешевле на 25% за уровень', max: 2, cost: l => 1500 * (l + 1) },
  { id: 'van',     cat: 'vip',   icon: '🚐', name: 'Фургон',             desc: '+1 место в очереди за уровень', max: 2, cost: l => 3000 * (l + 1) }
];
const CATS = [['eq', '⚙️ Оборудование'], ['beans', '☕ Зерна'], ['decor', '🎨 Декор'], ['vip', '💎 Премиум'], ['map', '🗺️ Районы']];
const BOTS = [['Алекс', 9800], ['Мария', 6200], ['Ким', 3400], ['Лука', 1800], ['Софи', 700]];

// ---------- состояние ----------
const SAVE_KEY = 'coffee-cart-v3';
let S = { money: 0, earned: 0, rep: 50, day: 1, beans: 'cheap', district: 0, unl: [true, false, false],
          lv: { machine: 0, queue: 0, helper: 0, awning: 0, sign: 0, music: 0, gold: 0, ads: 0, lease: 0, van: 0 } };
let customers = [], cooking = null, cookT = 0, spawnT = 0, eventT = 0, rainLeft = 0;
let dayT = 0, helperT = 0, floats = [], time = 0, cat = 'eq', view = 'game', paused = false;
let dayRev = 0, dayCups = 0, dayLost = 0;
const maxQ = () => 4 + S.lv.queue + S.lv.van;
const say = m => $('log').textContent = m;

// ---------- рисование людей ----------
function rr(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function ci(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.fill(); }

function person(x, y, o, s = 1) {
  const k = o.k, b = Math.sin(time * 3 + x * .05) * 1.5;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const pants = { office: '#4a4f5c', rush: '#2f3b52', tourist: '#d9c27a', critic: '#1d2433' }[k];
  const shoes = k === 'rush' ? '#ffffff' : '#15110e';
  rr(-14, -42, 12, 42, 3, pants); rr(2, -42, 12, 42, 3, pants);
  rr(-16, -5, 15, 6, 3, shoes); rr(1, -5, 15, 6, 3, shoes);
  const shirt = { office: '#f4f4f4', rush: '#43b581', tourist: '#ff7b6b', critic: '#1d2433' }[k];
  rr(-28, -82 + b, 10, 32, 5, shirt); rr(18, -82 + b, 10, 32, 5, shirt);
  rr(-20, -84 + b, 40, 46, 9, shirt);
  ci(-23, -47 + b, 5, o.skin); ci(23, -47 + b, 5, o.skin);
  rr(-5, -93 + b, 10, 10, 3, o.skin);
  ci(0, -104 + b, 17, o.skin);
  const hair = { office: '#2b1d14', rush: '#5b3a1e', tourist: '#7a4f24', critic: '#cfcfcf' }[k];
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -107 + b, 17, Math.PI, 0); ctx.fill();
  if (k === 'critic') { rr(-17, -110 + b, 5, 14, 2, hair); rr(12, -110 + b, 5, 14, 2, hair); }
  if (k !== 'tourist') { ci(-6, -104 + b, 2, '#222'); ci(6, -104 + b, 2, '#222'); }
  ctx.strokeStyle = '#7a3b2e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -99 + b, 5, .25, Math.PI - .25); ctx.stroke();

  if (k === 'office') {
    poly([[-4, -84 + b], [4, -84 + b], [3, -58 + b], [0, -53 + b], [-3, -58 + b]], '#2f6fed');
    ctx.strokeStyle = '#e86a5a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-7, -84 + b); ctx.lineTo(8, -62 + b); ctx.stroke();
    rr(4, -64 + b, 10, 13, 2, '#fff'); rr(6, -62 + b, 6, 3, 1, '#2f6fed');
  }
  if (k === 'critic') {
    poly([[-8, -84 + b], [8, -84 + b], [0, -60 + b]], '#f4f4f4');
    poly([[-3, -80 + b], [3, -80 + b], [2, -58 + b], [0, -54 + b], [-2, -58 + b]], '#c8362f');
    rr(-14, -72 + b, 5, 3, 1, '#f2b24a');
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(-6, -104 + b, 5, 0, 7); ctx.arc(6, -104 + b, 5, 0, 7); ctx.moveTo(-1, -104 + b); ctx.lineTo(1, -104 + b); ctx.stroke();
    rr(17, -42 + b, 22, 17, 3, '#7a4b2f'); rr(24, -45 + b, 8, 4, 2, '#4a2c19');
  }
  if (k === 'tourist') {
    [[-12, -74], [6, -68], [-4, -56], [12, -78], [-14, -48]].forEach(d => ci(d[0], d[1] + b, 2.4, 'rgba(255,255,255,.55)'));
    rr(-11, -106 + b, 9, 5, 2, '#111'); rr(2, -106 + b, 9, 5, 2, '#111');
    ctx.fillStyle = o.hat; ctx.beginPath(); ctx.ellipse(0, -116 + b, 28, 6, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -116 + b, 14, Math.PI, 0); ctx.fill();
    rr(-14, -121 + b, 28, 4, 1, 'rgba(0,0,0,.25)');
    rr(-8, -66 + b, 16, 11, 3, '#222'); ci(0, -60 + b, 3.5, '#6a8fb0');
  }
  if (k === 'rush') {
    rr(-17, -113 + b, 34, 5, 2, '#e8453a');
    [-10, -3, 4, 11].forEach(px => poly([[px - 3, -118 + b], [px, -126 + b], [px + 3, -118 + b]], hair));
    rr(-20, -66 + b, 40, 5, 0, 'rgba(255,255,255,.7)');
  }
  ctx.restore();
}

// ---------- сцена ----------
function drawBg() {
  const d = DIST[S.district];
  const g = ctx.createLinearGradient(0, 0, 0, SIDE); g.addColorStop(0, d.sky[0]); g.addColorStop(1, d.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (S.district === 2) {
    for (let i = 0; i < 7; i++) { const x = 30 + i * 72, h = 90 + (i * 37 % 60); rr(x - 7, SIDE - h, 14, h, 3, '#5a3b24'); ci(x, SIDE - h, 40 + (i % 3) * 7, d.far); }
  } else {
    for (let i = 0; i < 9; i++) {
      const w = 62 + (i * 29 % 30), h = 120 + (i * 53 % 140), x = i * 56 - 6;
      ctx.fillStyle = d.far; ctx.fillRect(x, SIDE - h, w, h);
      ctx.fillStyle = 'rgba(255,230,150,.55)';
      for (let r = 0; r < h - 24; r += 24) for (let c = 8; c < w - 12; c += 18) if ((i + r + c) % 3) ctx.fillRect(x + c, SIDE - h + 12 + r, 9, 12);
    }
  }
  if (S.district === 1) {
    rr(110, SIDE - 70, 380, 62, 10, '#c7463d'); rr(110, SIDE - 20, 380, 8, 0, '#8e2f29');
    for (let i = 0; i < 7; i++) rr(124 + i * 52, SIDE - 58, 36, 20, 3, '#cfe6f5');
  }
  [300, 435].forEach(x => { rr(x - 3, 300, 6, SIDE - 290, 2, '#2a2a2a'); ci(x, 298, 17, 'rgba(255,217,138,.25)'); ci(x, 298, 8, '#ffd98a'); });
  ctx.fillStyle = '#8d8478'; ctx.fillRect(0, SIDE, W, ROAD - SIDE);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let x = 40; x < W; x += 90) ctx.fillRect(x, SIDE, 2, ROAD - SIDE);
  ctx.fillStyle = '#6f675d'; ctx.fillRect(0, ROAD - 6, W, 6);
  ctx.fillStyle = '#4a4a50'; ctx.fillRect(0, ROAD, W, H - ROAD);
  ctx.fillStyle = '#e8e8e8'; for (let x = 10; x < W; x += 80) ctx.fillRect(x, ROAD + 24, 44, 4);
}

function drawCart() {
  ctx.save(); ctx.translate(0, 123); ctx.scale(.95, .95);
  person(135, 270, { k: 'office', skin: '#f1c27d' });
  rr(30, 222, 210, 72, 6, '#7a4b2f');
  for (let i = 0; i < 4; i++) rr(36, 232 + i * 14, 198, 2, 1, 'rgba(0,0,0,.18)');
  rr(24, 214, 222, 12, 4, '#a9714b');
  rr(188, 198, 14, 16, 3, '#f6e7d0'); rr(200, 202, 5, 8, 2, '#f6e7d0');
  if (cooking) { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(193 + Math.sin(time * 5) * 2, 194); ctx.bezierCurveTo(188, 184, 200, 180, 194, 170); ctx.stroke(); }
  for (let i = 0; i < 10; i++) { const c = i % 2 ? '#f6e7d0' : '#d6483a'; ctx.fillStyle = c; ctx.fillRect(30 + i * 21, 100, 21, 36); ci(40.5 + i * 21, 136, 10.5, c); }
  rr(26, 94, 218, 10, 4, '#8e2f29');
  rr(30, 104, 6, 118, 2, '#5a3b24'); rr(234, 104, 6, 118, 2, '#5a3b24');
  rr(58, 56, 164, 34, 8, '#2a1a0c'); ctx.strokeStyle = '#f2b24a'; ctx.lineWidth = 2; ctx.strokeRect(62, 60, 156, 26);
  ctx.fillStyle = '#f2b24a'; ctx.font = 'bold 18px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('☕ Coffee Cart', 140, 79);
  ci(72, 296, 17, '#222'); ci(72, 296, 7, '#999'); ci(200, 296, 17, '#222'); ci(200, 296, 7, '#999');
  if (cooking) { rr(50, 262, 170, 8, 4, 'rgba(0,0,0,.4)'); rr(50, 262, 170 * Math.min(cookT, 1), 8, 4, '#f2b24a'); }
  ctx.textAlign = 'left'; ctx.restore();
}

function slot(i) {
  const cols = Math.ceil(maxQ() / 2), sp = cols > 1 ? Math.min(54, 176 / (cols - 1)) : 54, row = i & 1;
  return { x: 262 + (i >> 1) * sp + row * 26, y: 452 - row * 22, s: 1.1 - row * .1 };
}

function draw() {
  drawBg(); drawCart();
  [...customers].sort((a, b) => a.y - b.y).forEach(c => {
    person(c.x, c.y, { k: c.t.k, skin: c.skin, hat: c.hat }, c.s);
    const by = c.y - 152 * c.s;
    rr(c.x - 24, by, 48, 6, 3, 'rgba(0,0,0,.45)');
    rr(c.x - 24, by, 48 * Math.max(c.p, 0), 6, 3, c.p > .35 ? '#7bd8a4' : '#e8453a');
    if (c.s > 1) { ctx.fillStyle = '#fff'; ctx.font = '11px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center'; ctx.fillText(c.t.name, c.x, c.y + 15); ctx.textAlign = 'left'; }
    if (c === cooking) { ctx.strokeStyle = '#f2b24a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(c.x, c.y + 3, 26 * c.s, 6, 0, 0, 7); ctx.stroke(); }
  });
  floats.forEach(f => { ctx.globalAlpha = Math.max(f.life, 0); ctx.fillStyle = f.c; ctx.font = 'bold 20px "Trebuchet MS",sans-serif'; ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1; });
  if (rainLeft > 0) {
    ctx.fillStyle = 'rgba(20,30,50,.18)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(200,220,255,.6)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i < 70; i++) { const x = (i * 97 + time * 300) % W, y = (i * 53 + time * 500) % H; ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 12); }
    ctx.stroke();
  }
}

// ---------- логика ----------
function pick() { let r = Math.random() * TYPES.reduce((s, t) => s + t.w, 0); for (const t of TYPES) { r -= t.w; if (r <= 0) return t; } return TYPES[0]; }
function spawn(n = 1) {
  for (let i = 0; i < n; i++) {
    if (customers.length >= maxQ()) return;
    const p = slot(customers.length);
    customers.push({ t: pick(), p: 1, x: W + 50, y: p.y, s: p.s, skin: SKINS[Math.random() * SKINS.length | 0], hat: HATS[Math.random() * HATS.length | 0] });
  }
}
const EVENTS = [
  ['Жара: молоко портится, один клиент уходит', () => { const c = customers.find(x => x !== cooking); if (c) c.p = 0; }],
  ['Проверка СЭС: штраф 30', () => { if (S.money >= 30) S.money -= 30; else { S.rep = Math.max(0, S.rep - 10); say('Нечем платить штраф, репутация падает'); } }],
  ['Автобус с туристами: толпа гостей!', () => spawn(3)],
  ['Дождь: клиентов станет меньше', () => { rainLeft = 15; }]
];

cv.addEventListener('click', e => {
  if (cooking || paused) return;
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width, my = (e.clientY - r.top) * H / r.height;
  const c = [...customers].sort((a, b) => b.y - a.y).find(c => Math.abs(mx - c.x) < 28 * c.s && my > c.y - 140 * c.s && my < c.y + 10);
  if (c) { cooking = c; cookT = 0; }
});

function endDay() {
  paused = true; cooking = null;
  const d = DIST[S.district], lv = S.lv;
  const rent = Math.round(d.rent * (1 + .08 * (S.day - 1)) * (1 - .25 * lv.lease));
  const elec = 4 + 3 * lv.machine, wage = 12 * lv.helper, tax = Math.round(.08 * dayRev);
  const total = rent + elec + wage + tax, profit = dayRev - total;
  let warn = '';
  if (S.money >= total) S.money -= total; else { S.money = 0; S.rep = Math.max(0, S.rep - 10); warn = 'Денег не хватило на все платежи, репутация упала на 10'; }
  const row = (n, v, cls = '') => `<div class="mrow ${cls}"><span>${n}</span><b>${v}</b></div>`;
  $('mcard').innerHTML = `<h2>Итоги дня ${S.day}</h2>` +
    row('Выручка', '+' + dayRev, 'pos') +
    row('Продано чашек', dayCups, 'sub') + row('Ушло клиентов', dayLost, 'sub') +
    row('Аренда места (' + d.name + ')', '-' + rent, 'neg') +
    row('Электричество', '-' + elec, 'neg') +
    (wage ? row('Зарплата помощников', '-' + wage, 'neg') : '') +
    row('Налог 8%', '-' + tax, 'neg') +
    row('Прибыль за день', (profit >= 0 ? '+' : '') + profit, 'tot ' + (profit >= 0 ? 'pos' : 'neg')) +
    row('Баланс', Math.floor(S.money), 'sub') +
    (warn ? `<div class="warn">${warn}</div>` : '') +
    `<button class="on" data-next="1">Начать день ${S.day + 1}</button>`;
  $('modal').hidden = false; save();
}
function nextDay() {
  S.day++; dayT = 0; dayRev = dayCups = dayLost = 0; paused = false; $('modal').hidden = true; say('Новый день: ' + S.day); save();
}

function frame(now) {
  const dt = Math.min((now - (frame.last || now)) / 1000, .1); frame.last = now; time += dt;
  if (!paused) {
    const d = DIST[S.district], lv = S.lv, prem = S.beans === 'premium';
    dayT += dt; if (dayT >= DAY_LEN) endDay();
    const rain = rainLeft > 0 ? .4 : 1; if (rainLeft > 0) rainLeft -= dt;
    spawnT += dt; if (spawnT > d.spawn * (1 - .08 * lv.sign - .1 * lv.ads) / rain) { spawn(); spawnT = 0; }
    eventT += dt; if (eventT > 25) { eventT = 0; const ev = EVENTS[Math.random() * EVENTS.length | 0]; say(ev[0]); ev[1](); }

    customers.forEach(c => { c.p -= dt * c.t.pat * (prem ? .6 : 1) * (1 - .08 * lv.music); });
    customers.filter(c => c.p <= 0).forEach(c => { S.rep = Math.max(0, S.rep - 2); dayLost++; floats.push({ x: c.x - 20, y: c.y - 160 * c.s, text: 'Ушел', c: '#e8453a', life: 1 }); if (c === cooking) cooking = null; });
    customers = customers.filter(c => c.p > 0);
    customers.forEach((c, i) => { const p = slot(i), k = Math.min(1, dt * 6); c.x += (p.x - c.x) * k; c.y += (p.y - c.y) * k; c.s += (p.s - c.s) * k; });

    if (!cooking && lv.helper && customers.length) { helperT += dt; if (helperT > 3.5 - lv.helper) { cooking = customers[0]; cookT = 0; helperT = 0; } } else helperT = 0;
    if (cooking) {
      cookT += dt * (0.9 + lv.machine * 0.3);
      if (cookT >= 1) {
        const gain = Math.round((12 + lv.machine * 2) * cooking.t.price * d.mul * (1 + .1 * lv.awning + .25 * lv.gold) * (prem ? 1.25 : 1)) - (prem ? 6 : 3);
        S.money += gain; S.earned += Math.max(gain, 0); dayRev += gain; dayCups++;
        S.rep = Math.min(100, S.rep + (cooking.t.rep || 1));
        floats.push({ x: cooking.x - 14, y: cooking.y - 160 * cooking.s, text: '+' + gain, c: '#f2b24a', life: 1 });
        customers = customers.filter(c => c !== cooking); cooking = null;
      }
    }
    floats.forEach(f => { f.y -= dt * 30; f.life -= dt; }); floats = floats.filter(f => f.life > 0);
  }
  draw(); hud(); requestAnimationFrame(frame);
}

// ---------- интерфейс ----------
function hud() {
  $('money').textContent = Math.floor(S.money); $('day').textContent = S.day; $('rep').textContent = Math.floor(S.rep);
  $('queue').textContent = customers.length + '/' + maxQ();
  $('dayRev').textContent = dayRev; $('dayLeft').textContent = 'До конца дня ' + Math.max(0, Math.ceil(DAY_LEN - dayT)) + ' с';
  $('barFill').style.width = Math.min(100, dayT / DAY_LEN * 100) + '%';
}
function renderShop() {
  $('tabs').innerHTML = CATS.map(([k, n]) => `<button class="${k === cat ? 'on' : ''}" data-cat="${k}">${n}</button>`).join('');
  let h = '';
  const row = (i, t, s, btn) => `<div class="item"><span class="i">${i}</span><div class="t">${t}<small>${s}</small></div>${btn}</div>`;
  if (cat === 'beans') {
    [['cheap', '🫘', 'Эконом', 'Стоит 3 за чашку'], ['premium', '☕', 'Премиум', 'Цена кофе +25%, клиенты терпеливее, стоит 6 за чашку']].forEach(([k, i, n, s]) =>
      h += row(i, n, s, `<button class="${S.beans === k ? 'on' : ''}" data-bean="${k}">${S.beans === k ? 'Выбрано' : 'Выбрать'}</button>`));
  } else if (cat === 'map') {
    DIST.forEach((d, i) => {
      const btn = S.unl[i] ? `<button class="${S.district === i ? 'on' : ''}" data-dist="${i}">${S.district === i ? 'Здесь' : 'Поехать'}</button>`
        : `<button data-dist="${i}" data-cost="${d.cost}">Открыть ${d.cost}</button>`;
      h += row(['🏙️', '🚉', '🌳'][i], d.name, 'Цена кофе x' + d.mul + ', аренда ' + d.rent + ' в день, клиенты каждые ~' + d.spawn + ' сек', btn);
    });
  } else {
    ITEMS.filter(x => x.cat === cat).forEach(x => {
      const l = S.lv[x.id], maxed = l >= x.max, c = x.cost(l);
      h += row(x.icon, `${x.name} (${l}/${x.max})`, x.desc, maxed ? '<button disabled>Максимум</button>' : `<button data-buy="${x.id}" data-cost="${c}">${c}</button>`);
    });
  }
  $('items').innerHTML = h; updateShop();
}
function updateShop() { document.querySelectorAll('[data-cost]').forEach(b => b.disabled = S.money < +b.dataset.cost); }

function renderBoard() {
  const rows = BOTS.map(([n, s]) => ({ n, s, me: false })).concat([{ n: myName + ' (ты)', s: Math.floor(S.earned), me: true }]).sort((a, b) => b.s - a.s);
  $('board').innerHTML = rows.map((r, i) =>
    `<div class="item${r.me ? ' me' : ''}"><span class="rank">${i + 1}</span><div class="t">${r.n}<small>Заработано за все время</small></div><span class="score">${r.s}</span></div>`).join('');
}

function showView(v) {
  view = v;
  ['game', 'shop', 'board'].forEach(k => $('v-' + k).hidden = k !== v);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'shop') renderShop();
  if (v === 'board') renderBoard();
}

$('app').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.next) { nextDay(); return; }
  if (d.view) { showView(d.view); return; }
  if (d.cat) cat = d.cat;
  else if (d.buy) { const x = ITEMS.find(i => i.id === d.buy), c = x.cost(S.lv[x.id]); if (S.money >= c && S.lv[x.id] < x.max) { S.money -= c; S.lv[x.id]++; save(); } }
  else if (d.bean) { S.beans = d.bean; save(); }
  else if (d.dist) { const i = +d.dist, dd = DIST[i]; if (!S.unl[i] && S.money >= dd.cost) { S.money -= dd.cost; S.unl[i] = true; } if (S.unl[i]) { S.district = i; say('Переехал: ' + dd.name); save(); } }
  else return;
  renderShop();
});
setInterval(() => { if (view === 'shop') updateShop(); if (view === 'board') renderBoard(); }, 500);

// ---------- сохранение ----------
function save() {
  const s = JSON.stringify(S);
  try { if (tg && tg.CloudStorage) tg.CloudStorage.setItem(SAVE_KEY, s); else localStorage.setItem(SAVE_KEY, s); } catch (e) {}
}
function load() {
  return new Promise(res => {
    try {
      if (tg && tg.CloudStorage) tg.CloudStorage.getItem(SAVE_KEY, (err, v) => res(!err && v ? JSON.parse(v) : null));
      else { const v = localStorage.getItem(SAVE_KEY); res(v ? JSON.parse(v) : null); }
    } catch (e) { res(null); }
  });
}
setInterval(save, 5000);
load().then(s => { if (s) S = Object.assign(S, s, { lv: Object.assign(S.lv, s.lv) }); requestAnimationFrame(frame); });
</script>
