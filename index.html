<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Cart</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0e10;--card:#17191c;--card2:#202226;--line:#34312b;--text:#eee9df;--mute:rgba(238,233,223,.58);--acc:#c7a66a;--on:#17130d;--good:#a8b99a;--bad:#c87969;--shadow:0 8px 26px rgba(0,0,0,.42)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;transition:background .25s,color .25s}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 12px calc(98px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.head-actions{display:flex;align-items:center;gap:7px;min-width:0}
#topSettings{width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;font-size:19px;border-radius:13px;flex:none}
.brand{font-size:19px;font-weight:700;color:var(--acc);user-select:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#acc{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:13px;max-width:52%;cursor:pointer;box-shadow:var(--shadow)}
#accName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bava,.pava,#ava{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.bava img,.pava img,#ava img{width:100%;height:100%;object-fit:cover}
.pava{width:56px;height:56px;font-size:24px}
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 10px;font-size:11px;color:var(--mute);box-shadow:var(--shadow)}
.stat b{display:block;font-size:18px;color:var(--acc);margin-top:1px}
#dayInfo{display:flex;justify-content:space-between;font-size:13px;margin:12px 0 5px;color:var(--mute)}
#dayInfo b{color:var(--acc)}
#bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-bottom:8px}
#barFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#e8843a)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap}
.chip.low{border-color:var(--bad);color:var(--bad)}
canvas{width:100%;aspect-ratio:480/520;display:block;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:manipulation}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;white-space:nowrap;transition:transform .08s,background .15s}
button:active:not(:disabled){transform:scale(.96)}
button.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.list{display:grid;gap:8px;margin-top:8px}
.item{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.item.col{flex-direction:column;align-items:stretch}
.item .i{font-size:28px}
.item .t{flex:1;font-size:14px;min-width:0}
.item .t small{display:block;color:var(--mute);font-size:12px;margin-top:2px;line-height:1.35}
.item.me{border-color:var(--acc)}
.row{width:100%;text-align:left;white-space:normal}
.rank{width:26px;text-align:center;font-weight:700;color:var(--acc)}
.score{font-weight:700;color:var(--acc)}
.note{font-size:12px;color:var(--mute);margin:10px 2px}
.meter{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.packs{display:flex;gap:6px}.packs button{flex:1;padding:8px 4px;line-height:1.25;text-align:center}
.packs small{color:inherit;opacity:.75}
.inrow{display:flex;gap:6px}
input{flex:1;min-width:0;font:inherit;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 20px));display:flex;gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);z-index:5}
#nav button{flex:1;font-size:25px;line-height:1;padding:11px 0;border:0;background:transparent;border-radius:18px}
#nav button.on{background:var(--acc)}
#sheet{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 12px));background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35);z-index:4;display:flex;flex-direction:column;overflow:hidden;transition:height .22s ease}
#grab{padding:12px 0 10px;touch-action:none;cursor:grab;flex:none}
#grab i{display:block;width:46px;height:5px;border-radius:3px;background:var(--mute);opacity:.45;margin:0 auto}
#sbody{overflow:auto;padding:0 12px 14px;flex:1;overscroll-behavior:contain}
#sbody .list{margin-top:6px}
#psheet{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 12px));background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 26px 26px;box-shadow:0 10px 34px rgba(0,0,0,.4);z-index:17;display:flex;flex-direction:column;overflow:hidden;transition:height .22s ease}
#pbody{flex:1;overflow:auto;padding:16px 16px 0;overscroll-behavior:contain}
#pgrab{padding:12px 0 12px;touch-action:none;cursor:grab;flex:none}
#pgrab i{display:block;width:46px;height:5px;border-radius:3px;background:var(--mute);opacity:.45;margin:0 auto}
.prow{display:flex;gap:14px;align-items:center}
.pav{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,var(--acc),#e8843a);color:var(--on);font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.pav img{width:100%;height:100%;object-fit:cover}
.pn{min-width:0}
.pn h2{margin:0;font-size:26px;line-height:1.1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pu{font-size:16px;color:var(--mute);margin-top:4px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px}
.pst{padding:0 8px;border-left:1px solid var(--line);min-width:0}
.pst:first-child{border-left:0;padding-left:0}
.pl{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:11px;line-height:1.15;min-height:26px}
.pl svg{width:16px;height:16px;flex:none}
.pst b{display:block;font-size:20px;margin-top:4px;color:var(--text);overflow:hidden;text-overflow:ellipsis}
#pmore{margin-top:14px;padding-bottom:6px}
#alert{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 20px));background:var(--bad);color:#fff;border-radius:16px;padding:9px 10px 9px 14px;display:flex;justify-content:space-between;align-items:center;z-index:15;box-shadow:var(--shadow);font-weight:700}
#alert button{background:#fff;color:var(--bad);border:0;font-weight:700}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);max-width:calc(100% - 24px);background:var(--card);border:1px solid var(--acc);color:var(--text);border-radius:14px;padding:10px 16px;font-size:14px;z-index:16;box-shadow:var(--shadow);transition:transform .25s}
#toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.card{background:var(--card);border:1px solid var(--acc);border-radius:22px;padding:18px;width:min(100%,440px);max-height:92vh;overflow:auto}
.card h2{margin:0 0 12px;font-size:20px;color:var(--acc)}
.card>button.on{width:100%;margin-top:14px;padding:12px}
.mrow{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-bottom:1px solid var(--line)}
.mrow.sub{font-size:13px;color:var(--mute)}
.mrow.tot{font-size:18px;border:0;padding-top:10px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.warn{color:var(--bad);font-size:13px;margin-top:8px}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.phead h2{margin:0 0 4px}
.lvl{background:var(--acc);color:var(--on);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.dg{margin-top:10px;font-size:12px;color:var(--mute)}
.drow{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.drow button{flex:1;white-space:normal;padding:8px 6px;font-size:13px}

/* PREMIUM MONOCHROME — graphite surfaces, champagne accents, unified object treatment */
body{background:radial-gradient(ellipse at 50% -18%,rgba(199,166,106,.10),transparent 46%),var(--bg)}
#app{max-width:580px}
.brand{color:var(--text);letter-spacing:.035em}
.brand:first-letter{color:var(--acc)}
#acc{background:linear-gradient(145deg,#1c1e21,#121416);border-color:#484033}
#topSettings{background:linear-gradient(145deg,#222428,#151619);border-color:#484033;color:var(--acc);box-shadow:inset 0 1px rgba(255,255,255,.05),var(--shadow)}
.stat,.item,.card,#sheet,#psheet,#nav{background:linear-gradient(150deg,rgba(31,33,36,.98),rgba(19,20,22,.98));border-color:rgba(199,166,106,.22);box-shadow:inset 0 1px rgba(255,255,255,.035),var(--shadow)}
.stat{border-radius:15px}
.stat b,.score,.rank{color:var(--acc)}
#dayInfo b{color:var(--acc)}
#bar{background:#292a2b}
#barFill,.meter i{background:linear-gradient(90deg,#8d7041,#d5b77e)}
.chip{background:#191b1e;border-color:#39362f;color:#d9d2c5}
canvas{border-color:rgba(199,166,106,.30);box-shadow:0 12px 34px rgba(0,0,0,.48)}

.item .i{font-size:29px;text-shadow:0 3px 10px rgba(199,166,106,.12)}
.item.me{border-color:var(--acc);box-shadow:0 0 0 1px rgba(199,166,106,.10),var(--shadow)}
button{background:linear-gradient(145deg,#202226,#17191c);border-color:#3a3832}
button.on{background:linear-gradient(135deg,#d4b77e,#a98a54);color:#17130d;border-color:#d4b77e;box-shadow:0 4px 16px rgba(199,166,106,.18)}
#nav{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#nav button.on{background:linear-gradient(135deg,#d4b77e,#a98a54);color:#17130d}
#sheet{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card{border-color:rgba(199,166,106,.48)}
.card h2{color:var(--acc)}
.pav{background:linear-gradient(135deg,#b99a62,#6e5837)}
.pst{border-color:rgba(199,166,106,.22)}
.lvl{background:linear-gradient(135deg,#d4b77e,#a98a54);color:#17130d}
input{background:#111315;border-color:#39362f}
#toast{background:#191b1e;border-color:var(--acc)}
#alert{background:#70443d}

@media(hover:hover){button:hover:not(:disabled){border-color:rgba(199,166,106,.55)}.item:hover{border-color:rgba(199,166,106,.42)}}


/* COFFEE CART — COLORFUL PREMIUM DARK (v13)
   Dark-only interface; restore natural saturated game and item colors. */
:root{
  color-scheme:dark;
  --bg:#100d0b;--card:#1c1713;--card2:#292019;--line:#49372a;
  --text:#fff1df;--mute:rgba(255,235,213,.62);
  --acc:#ffad42;--on:#211308;--good:#65d69a;--bad:#ff766b;
  --shadow:0 9px 28px rgba(0,0,0,.48)
}
html,body{background-color:#100d0b;color:var(--text)}
body{background:radial-gradient(ellipse at 50% -18%,rgba(255,153,51,.16),transparent 48%),radial-gradient(ellipse at 100% 45%,rgba(96,49,22,.13),transparent 42%),#100d0b}
.stat,.item,.card,#sheet,#psheet,#nav{
  background:linear-gradient(150deg,rgba(43,31,23,.98),rgba(24,19,16,.98));
  border-color:rgba(255,173,66,.25)
}
.brand{color:#ffd59c}
#acc{background:linear-gradient(145deg,#302116,#19130f);border-color:#79502e}
#topSettings{background:linear-gradient(145deg,#382719,#21170f);border-color:#79502e;color:#ffc16b}
.stat b,.score,.rank,#dayInfo b{color:#ffbd68}
#barFill,.meter i{background:linear-gradient(90deg,#e97828,#ffbd55 58%,#ffe09a)}
.chip{background:#241a14;border-color:#58402d;color:#f3d8b8}
/* The game canvas is intentionally not desaturated: preserve all scene colors. */
canvas{border-color:rgba(255,173,66,.34);box-shadow:0 12px 34px rgba(0,0,0,.5)}
.item .i{font-size:29px;text-shadow:0 3px 12px rgba(255,151,54,.22)}
button{background:linear-gradient(145deg,#302219,#1d1712);border-color:#59402c}
button.on,#nav button.on{background:linear-gradient(135deg,#ffc36e,#f18a2d);color:#281606;border-color:#ffc36e;box-shadow:0 4px 18px rgba(255,145,45,.24)}
.pav{background:linear-gradient(135deg,#ffbd62,#df7130)}
.lvl{background:linear-gradient(135deg,#ffc36e,#f18a2d);color:#281606}
input{background:#17110d;border-color:#59402c;color:#fff1df}
#toast{background:#241a14;border-color:#ffad42}
#alert{background:#9b3f32}
#sheet,#psheet,#nav{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
@media(hover:hover){button:hover:not(:disabled){border-color:rgba(255,173,66,.72)}.item:hover{border-color:rgba(255,173,66,.5)}}

/* ===== COFFEE CART — PREMIUM GLASS ===== */
:root{--glass:rgba(255,244,230,.055);--glass2:rgba(255,244,230,.095);--edge:rgba(255,255,255,.26);--edgeSoft:rgba(255,255,255,.14);--hi:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.05);--blur:saturate(170%) blur(20px);--r-pill:999px}
html,body{background-color:#0b0908}
body{background:radial-gradient(ellipse at 50% -12%,rgba(255,153,51,.22),transparent 52%),radial-gradient(ellipse at 108% 42%,rgba(255,110,40,.14),transparent 44%),radial-gradient(ellipse at -10% 78%,rgba(120,70,200,.10),transparent 46%),#0b0908;background-attachment:fixed}
.stat,.item,.card,#sheet,#psheet,#nav,#acc,#topSettings,#toast,#alert,button,input,.chip,.meter,#bar{backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.stat,.item,.card,#sheet,#psheet,#nav,#acc,#topSettings,#toast{background:linear-gradient(150deg,var(--glass2),var(--glass))!important;border:1px solid var(--edge)!important;box-shadow:var(--hi),0 10px 30px rgba(0,0,0,.45)!important}
.stat,.item,.card,#sheet,#psheet,#nav,#acc,#topSettings{position:relative}
.stat::before,.item::before,.card::before,#nav::before,#acc::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);border-radius:999px;opacity:.7}
#acc,.chip,.lvl,#toast,#alert,#bar,.meter,input{border-radius:var(--r-pill)!important}
.stat{border-radius:20px!important;padding:9px 12px!important}
.item{border-radius:24px!important;padding:12px 14px!important}
.card{border-radius:30px!important;border-color:rgba(255,255,255,.34)!important}
#sheet{border-radius:30px 30px 0 0!important}
#psheet{border-radius:0 0 32px 32px!important}
#nav{border-radius:var(--r-pill)!important;padding:7px!important;gap:6px!important}
#topSettings{border-radius:var(--r-pill)!important;width:40px!important;height:40px!important;color:#ffd7a1!important}
button{border-radius:var(--r-pill)!important;background:linear-gradient(150deg,var(--glass2),var(--glass))!important;border:1px solid var(--edgeSoft)!important;box-shadow:var(--hi)!important;transition:transform .09s,border-color .18s,background .18s,box-shadow .18s}
button.on,#nav button.on{background:linear-gradient(135deg,#ffd79a,#ffab48 55%,#f0842a)!important;color:#2a1607!important;border-color:rgba(255,255,255,.72)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 6px 22px rgba(255,145,45,.35)!important}
input{background:rgba(255,244,230,.06)!important;border:1px solid var(--edgeSoft)!important;padding:10px 16px!important}
.ov{background:rgba(8,6,5,.55);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%)}
#bar{background:rgba(255,255,255,.08)!important;border:1px solid var(--edgeSoft);height:8px}
.meter{background:rgba(255,255,255,.08)!important;border:1px solid var(--edgeSoft);height:9px}
#barFill,.meter i{background:linear-gradient(90deg,#e97828,#ffbd55 58%,#fff0cf)!important;box-shadow:0 0 12px rgba(255,170,70,.55)}
.chip{background:rgba(255,244,230,.06)!important;border:1px solid var(--edgeSoft)!important;color:#ffe6c8!important;display:inline-flex;align-items:center;gap:6px;padding:6px 13px!important}
.chip.low{border-color:rgba(255,118,107,.75)!important;color:#ffb3ab!important}
canvas{border-radius:26px!important;border:1px solid rgba(255,255,255,.22)!important;box-shadow:var(--hi),0 16px 40px rgba(0,0,0,.55)!important}
.brand{color:#ffe3ba!important;text-shadow:0 2px 14px rgba(255,160,60,.25)}
.stat b,.score,.rank,#dayInfo b{color:#ffc879!important}
.pst{border-color:rgba(255,255,255,.16)!important}
.mrow{border-color:rgba(255,255,255,.10)!important}
#grab i,#pgrab i{background:rgba(255,255,255,.55)!important;opacity:.8!important;width:52px!important}
#alert{background:linear-gradient(150deg,rgba(255,118,107,.30),rgba(155,63,50,.35))!important;border-color:rgba(255,180,170,.55)!important;color:#fff!important}
#alert button{background:rgba(255,255,255,.92)!important;color:#8d3327!important;border:0!important}
.item.me{border-color:rgba(255,196,120,.85)!important;box-shadow:var(--hi),0 0 0 1px rgba(255,173,66,.25),0 10px 30px rgba(0,0,0,.45)!important}
@media(hover:hover){button:hover:not(:disabled){border-color:rgba(255,255,255,.55)!important;background:linear-gradient(150deg,rgba(255,244,230,.14),rgba(255,244,230,.07))!important}.item:hover{border-color:rgba(255,255,255,.42)!important}}
.pi{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none;overflow:visible}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0 8px!important;font-size:11px!important;border:1px solid transparent!important;background:transparent!important;box-shadow:none!important;color:rgba(255,235,213,.72)!important}
#nav button .pi{width:24px;height:24px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
#nav button.on{color:#2a1607!important}
#nav button span.nl{font-weight:600;font-size:10.5px;opacity:.9;white-space:nowrap}
#topSettings .pi{width:21px;height:21px}
.item .i{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:16px;font-size:0;background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(0,0,0,.35);color:#ffcb84;text-shadow:none!important}
.item .i .pi{width:24px;height:24px;filter:drop-shadow(0 2px 5px rgba(255,150,50,.35))}
.chip .pi{width:15px;height:15px;color:#ffc879}
.chips button{display:inline-flex;align-items:center}
.chips button .pi{width:15px;height:15px;margin-right:5px}
.pl .pi{width:16px;height:16px;color:#ffc879}
.pav{border-radius:26px!important;border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px rgba(0,0,0,.45)}
.bava,#ava{border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.lvl{border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.rank,.stat b{font-variant-numeric:tabular-nums}
.note{color:rgba(255,235,213,.55)}
.chips{padding-bottom:8px}
#sheet,#psheet{background:linear-gradient(150deg,rgba(46,33,24,.72),rgba(20,16,13,.78))!important}
#nav{background:linear-gradient(150deg,rgba(46,33,24,.62),rgba(20,16,13,.70))!important}
.card{background:linear-gradient(150deg,rgba(48,34,25,.80),rgba(22,17,14,.86))!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.stat,.item,.card,#sheet,#psheet,#nav,#acc,#topSettings,#toast,button{background:linear-gradient(150deg,#2b1f17,#181310)!important}}

</style>
</head>
<body>
<div id="alert" hidden><span>🔧 Машинка сломалась</span><button id="repBtn" data-act="repair">Починить</button></div>
<div id="toast"></div>
<div id="app">
  <header>

function iconize(root) {

  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = []; let n;
  while ((n = walk.nextNode())) {
    if (n.parentElement && n.parentElement.closest('svg')) continue;
    if (/[\u2600-\u27BF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDD00-\uDFFF]/.test(n.nodeValue)) list.push(n);
  }
  list.forEach(t => {
    let txt = t.nodeValue, hit = false;
    for (const e in EM2PI) if (txt.includes(e)) { txt = txt.split(e).join('\u0000' + EM2PI[e] + '\u0000'); hit = true; }

      if (i % 2) frag.appendChild(document.createRange().createContextualFragment(pi(part)));
      else if (part) frag.appendChild(document.createTextNode(part));
    });
    t.parentNode.replaceChild(frag, t);
  });
}

  heat() { if (S.stock.milk > 4) { S.stock.milk = Math.max(0, S.stock.milk - 4); toast('🥛 Жара, часть молока испортилась', 'heat'); } },
  bus() { spawn(6); toast('🚌 Автобус туристов', 'bus'); },
  ses() { if (S.rep > 35) { S.rep -= 8; toast('👮 Проверка СЭС, репутация -8', 'ses'); } else toast('👮 СЭС: всё чисто', 'sesok'); }
};

// ---------- спавн и логика ----------
function spawn(n = 1) {
  const cap = maxQ(), d = DIST[S.district];
  for (let i = 0; i < n && customers.length < cap; i++) {
    const t = TYPES[Math.random() * TYPES.length | 0];
    customers.push({ x: W + 30 + i * 40, type: t, wait: 12 + (S.staff.cashier * 3) + (S.lv.music * 2), skin: SKINS[Math.random() * 5 | 0], hat: HATS[Math.random() * 5 | 0], served: false, angry: 0 });
  }
}
function breakMachine() { if (!S.broken && !god) { S.broken = true; toast('⚙️ Кофемашина сломалась', 'brk'); } }

function serve(c) {
  const price = priceOf(c.type);
  S.money += price; S.earned += price; S.cups++; dayRev += price; dayCups++;
  S.rep = clamp(S.rep + (c.type.rep || .4), 0, 100);
  if (S.cups > S.best) S.best = S.cups; // best is cups-based locally? No, best is daily rev usually. Let's track daily rev best.
  // Actually in this code `best` seems to be used for daily revenue record based on server sync `best: Math.floor(S.best)`.
  // But local logic `if (S.cups > S.best)` implies cups. Let's fix to daily revenue.
  if (dayRev > S.best) S.best = dayRev;
  
  floats.push({ x: c.x, y: B - 60, t: '+$' + price.toFixed(1), life: 1, c: '#65d69a' });
  if (!god) { S.stock.beans--; S.stock.milk--; }
  c.served = true;
}

function endDay() {
  const rent = DIST[S.district].rent * (1 - .25 * S.lv.lease);
  const wages = STAFF.reduce((a, s) => a + s.wage * S.staff[s.id], 0);
  const total = rent + wages;
  S.money -= total; S.day++; dayT = 0;
  if (S.money < 0) S.money = 0; // Prevent negative? Or debt? Let's keep 0.
  toast(`🌙 День ${S.day - 1}: выручка $${dayRev.toFixed(0)}, расходы $${total.toFixed(0)}`, 'day');
  dayRev = 0; dayCups = 0; dayLost = 0; dayBuy = 0;
  sync();
}

// ---------- цикл ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000) * gameSpeed; last = now;
  fps = fps * .9 + (1 / (dt / gameSpeed || 1)) * .1;
  time += dt;
  if (!paused) {
    dayT += dt;
    if (dayT >= DAY_LEN) endDay();
    
    // Spawn
    spawnT -= dt;
    if (spawnT <= 0 && !S.broken) {
      const rate = DIST[S.district].spawn * (1 - .15 * S.lv.sign) * (1 - .25 * S.lv.ads) * (rainLeft > 0 ? 2.5 : 1);
      spawnT = Math.max(.5, rate);
      spawn(1);
    }
    
    // Events
    eventT -= dt;
    if (eventT <= 0) {
      eventT = 25 + Math.random() * 20;
      const r = Math.random();
      if (r < .3) EV.rain(); else if (r < .5) EV.heat(); else if (r < .7) EV.bus(); else if (r < .85) EV.ses();
    }
    if (rainLeft > 0) rainLeft -= dt;
    
    // Break
    if (!S.broken && !god && Math.random() < breakP() * dt) breakMachine();
    if (S.broken && S.staff.mechanic > 0) {
      repairT -= dt;
      if (repairT <= 0) { S.broken = false; toast('🔧 Механик починил машину', 'fix'); repairT = 10; }
    } else repairT = 10 / (1 + S.staff.mechanic);

    // Cooking
    if (cooking) {
      cookT -= dt * (.9 + .28 * S.lv.machine) * (1 + .2 * S.staff.barista);
      if (cookT <= 0) { serve(cooking); cooking = null; }
    } else if (!S.broken) {
      const c = customers.find(x => !x.served && x.x <= SIDE);
      if (c) {
        if (!god && S.stock.beans < 1) { toast('🫘 Закончились бобы, загляни в 🛒', 'nb'); }
        else if (!god && S.stock.milk < 1) { toast('🥛 Закончилось молоко, загляни в 🛒', 'nm'); }
        else { cooking = c; cookT = 1.2; }
      }
    }
    
    // Customers move
    for (let i = customers.length - 1; i >= 0; i--) {
      const c = customers[i];
      if (c.served) { c.x += 120 * dt; if (c.x > W + 50) customers.splice(i, 1); }
      else {
        const target = SIDE - 40 - i * 45;
        if (c.x > target) c.x -= 60 * dt;
        else {
          c.wait -= dt;
          if (c.wait <= 0) {
            c.angry = 1; c.x += 120 * dt; // leave
            S.rep = clamp(S.rep - 1.5, 0, 100); dayLost++;
            if (c === cooking) cooking = null;
            if (c.x > W + 50) customers.splice(i, 1);
          }
        }
      }
    }
    
    // Auto-buy hint
    if (dayT > 10 && dayBuy === 0 && (S.stock.beans < 6 || S.stock.milk < 6)) {
       // Just toast once
       if (!god && (S.stock.beans < 6 || S.stock.milk < 6)) toast('⚠️ Продукты на исходе, загляни в 🛒', 'low');
       dayBuy = 1; 
    }
  }
  
  draw();
  requestAnimationFrame(frame);
}

// ---------- рисование ----------
function rr(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function ci(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.fill(); }
const FONT = '"Trebuchet MS",sans-serif';

function person(x, y, o, s = 1) {
  const k = o.k, b = Math.sin(time * 6 + x) * 2 * (o.served ? 0 : 1);
  ctx.save(); ctx.translate(x, y + b); ctx.scale(s, s);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 42, 14, 4, 0, 0, 7); ctx.fill();
  // Legs
  ctx.fillStyle = '#333'; rr(-8, 20, 6, 22, 3); rr(2, 20, 6, 22, 3);
  // Body
  ctx.fillStyle = o.skin; rr(-10, -5, 20, 28, 6);
  // Head
  ci(0, -16, 11, o.skin);
  // Hat
  ctx.fillStyle = o.hat; rr(-12, -26, 24, 8, 4); rr(-8, -32, 16, 8, 4);
  // Face
  ctx.fillStyle = '#000'; ci(-4, -16, 1.5); ci(4, -16, 1.5);
  if (o.angry) { ctx.strokeStyle='#f00'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(-6,-20); ctx.lineTo(-2,-18); ctx.moveTo(6,-20); ctx.lineTo(2,-18); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(0, -12, 3, 0, Math.PI); ctx.stroke(); }
  ctx.restore();
}

function drawCart() {
  const x = SIDE, y = B;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y + 45, 70, 12, 0, 0, 7); ctx.fill();
  // Wheels
  ci(x - 40, y + 35, 12, '#222'); ci(x + 40, y + 35, 12, '#222'); ci(x - 40, y + 35, 6, '#555'); ci(x + 40, y + 35, 6, '#555');
  // Body
  const grad = ctx.createLinearGradient(x - 60, y - 80, x + 60, y + 20);
  grad.addColorStop(0, '#5c3a21'); grad.addColorStop(1, '#3e2723');
  ctx.fillStyle = grad; rr(x - 60, y - 80, 120, 100, 12);
  // Counter
  ctx.fillStyle = '#8d6e63'; rr(x - 65, y - 20, 130, 15, 4);
  // Roof
  ctx.fillStyle = '#d7ccc8'; poly([[x - 70, y - 80], [x + 70, y - 80], [x + 50, y - 130], [x - 50, y - 130]]);
  // Stripes
  ctx.fillStyle = '#ffab42'; poly([[x - 50, y - 130], [x - 30, y - 130], [x - 40, y - 80], [x - 60, y - 80]]);
  poly([[x - 10, y - 130], [x + 10, y - 130], [x, y - 80], [x - 20, y - 80]]);
  poly([[x + 30, y - 130], [x + 50, y - 130], [x + 40, y - 80], [x + 20, y - 80]]);
  // Sign
  ctx.fillStyle = '#fff'; rr(x - 40, y - 115, 80, 25, 4);
  ctx.fillStyle = '#3e2723'; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(S.name || 'COFFEE', x, y - 102);
  // Machine
  ctx.fillStyle = '#silver'; rr(x + 10, y - 60, 30, 40, 4); ctx.fillStyle = '#333'; rr(x + 15, y - 55, 20, 10, 2);
  if (S.broken) { ctx.fillStyle = '#f44336'; ctx.font = '20px sans-serif'; ctx.fillText('⚠️', x + 25, y - 70); }
  else if (cooking) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 25, y - 65 - Math.sin(time*10)*5, 4 + Math.sin(time*10)*2, 0, 7); ctx.fill(); }
}

function drawBg() {
  const d = DIST[S.district];
  // Sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, d.sky[0]); g.addColorStop(1, d.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Sun/Moon
  ci(W - 60, 60, 25, 'rgba(255,255,255,.8)');
  // Far buildings/trees
  ctx.fillStyle = d.far;
  for(let i=0; i<W; i+=40) {
    const h = 50 + Math.sin(i)*20;
    if (d.kind === 'park' || d.kind === 'sea') { ctx.beginPath(); ctx.arc(i+20, B-100, 30, 0, 7); ctx.fill(); ctx.fillRect(i+15, B-100, 10, 100); }
    else { ctx.fillRect(i, B-100-h, 35, h+100); ctx.fillStyle='rgba(255,255,200,.3)'; for(let wy=B-90-h; wy<B-100; wy+=15) for(let wx=i+5; wx<i+30; wx+=10) ctx.fillRect(wx,wy,4,6); ctx.fillStyle=d.far; }
  }
  // Road
  ctx.fillStyle = '#444'; ctx.fillRect(0, B, W, H-B);
  ctx.fillStyle = '#666'; ctx.fillRect(0, B+5, W, 4);
  // Sidewalk
  ctx.fillStyle = '#777'; ctx.fillRect(0, B-20, W, 20);
  // Rain
  if (rainLeft > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1;
    for(let i=0; i<50; i++) { const rx = (time*200 + i*30)%W; const ry = (time*500 + i*50)%H; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx-5, ry+15); ctx.stroke(); }
  }
}

function draw() {
  ctx.save();
  ctx.scale(K, K);
  drawBg();
  
  // Queue line
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(W, B-10); ctx.lineTo(SIDE-40, B-10); ctx.stroke(); ctx.setLineDash([]);
  
  customers.forEach(c => person(c.x, B - 10, c));
  drawCart();
  
  // Floats
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 20 * (1/60); f.life -= 1/60;
    ctx.globalAlpha = f.life; ctx.fillStyle = f.c; ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(f.t, f.x, f.y); ctx.globalAlpha = 1;
    if (f.life <= 0) floats.splice(i, 1);
  }
  
  // Day progress
  const pct = dayT / DAY_LEN;
  $('barFill').style.width = (pct * 100) + '%';
  const left = Math.ceil(DAY_LEN - dayT);
  setT('dayLeft', left + 'с до конца дня');
  
  ctx.restore();
  updateUI();
}

const sheet = $('sheet'); let sheetH = 0, lastH = 0;
const botEdge = () => innerHeight - $('nav').getBoundingClientRect().top + 6;
const sheetMax = () => Math.max(160, innerHeight * .7 - botEdge());
function setSheet(h) { sheetH = clamp(h, 0, sheetMax()); sheet.style.bottom = botEdge() + 'px'; sheet.style.height = sheetH + 'px'; }
const grab = $('grab'); let dragY = 0, dragH = 0, dragging = false;
grab.addEventListener('pointerdown', e => { dragging = true; dragY = e.clientY; dragH = sheetH; sheet.style.transition = 'none'; try { grab.setPointerCapture(e.pointerId); } catch (x) {} });
grab.addEventListener('pointermove', e => { if (dragging) setSheet(dragH + (dragY - e.clientY)); });
const endDrag = () => { if (!dragging) return; dragging = false; sheet.style.transition = ''; if (sheetH < 110) closeSheet(); else lastH = sheetH; };
grab.addEventListener('pointerup', endDrag); grab.addEventListener('pointercancel', endDrag);
addEventListener('resize', () => { if (!sheet.hidden) setSheet(sheetH); });
function closeSheet() { view = null; sheet.hidden = true; document.querySelectorAll('#nav button').forEach(b => b.classList.remove('on')); }
function openView(v) {
  if (view === v) { closeSheet(); return; }
  view = v; sheet.hidden = false;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  document.querySelectorAll('#sbody > section').forEach(s => s.hidden = s.id !== 'v-' + v);
  if (v === 'shop') renderShop(); if (v === 'sup') renderSup(); if (v === 'set') renderSet();
  if (v === 'board') renderBoard();
  setSheet(lastH || sheetMax() * .6);
}

};
const psheet = $('psheet'), pgrab = $('pgrab'); let pH = 0, pbase = 170, pdY = 0, pdH = 0, pdrag = false, pmoved = 0;
const pMax = () => Math.max(pbase, innerHeight * .7 - 8);
function setP(h) { pH = clamp(h, 0, pMax()); psheet.style.height = pH + 'px'; }
function closeProfile() { psheet.hidden = true; }
pgrab.addEventListener('pointerdown', e => { pdrag = true; pdY = e.clientY; pdH = pH; pmoved = 0; psheet.style.transition = 'none'; try { pgrab.setPointerCapture(e.pointerId); } catch (x) {} });
pgrab.addEventListener('pointermove', e => { if (!pdrag) return; pmoved = Math.max(pmoved, Math.abs(e.clientY - pdY)); setP(pdH + (e.clientY - pdY)); });
const pEnd = () => { if (!pdrag) return; pdrag = false; psheet.style.transition = ''; if (pmoved < 5 || pH < pbase * .6) closeProfile(); else if (pH < pbase) setP(pbase); };
pgrab.addEventListener('pointerup', pEnd); pgrab.addEventListener('pointercancel', pEnd);

async function openProfile(id) {
  const own = !user || id === user.id;
  $('pbody').innerHTML = '<div class="note">Загружаю...</div>';
  if (psheet.hidden) { psheet.hidden = false; pbase = 110; setP(pbase); }
  let p;
  try { p = await api('/api/profile?id=' + id); }
  catch (e) {
    if (own) p = { name: myName, photo: user && user.photo_url };
    else { $('pbody').innerHTML = '<div class="note">Профиль не загрузился</div>'; return; }
  }
  if (own) Object.assign(p, { name: p.name || myName, username: (user && user.username) || p.username, money: S.money, level: levelOf(xpOf()), earned: Math.floor(S.earned), cups: S.cups || 0, best: Math.floor(S.best || 0), day: S.day, rep: Math.floor(S.rep), district: S.district, upg: upgCount() });
  const pav = p.photo && /^https:\/\//.test(p.photo) ? `<div class="pav"><img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer"></div>` : `<div class="pav">${esc((p.name || '?')[0].toUpperCase())}</div>`;
  const st = (i, l, v) => `<div class="pst"><div class="pl">${ICO[i]}<span>${l}</span></div><b>${v}</b></div>`;
  const r = (n, v) => `<div class="mrow"><span>${n}</span><b>${v}</b></div>`, rk = x => x ? '#' + x : '-';
  $('pbody').innerHTML = `<div id="phead"><div class="prow">${pav}<div class="pn"><h2>${esc(p.name)}</h2>${p.username ? `<div class="pu">@${esc(p.username)}</div>` : ''}</div></div>` +
    `<div class="pstats">${st('coin', 'Баланс', p.money != null ? fm(p.money) : '-')}${st('star', 'Уровень', p.level)}${st('cal', 'Дней', p.day)}${st('cup', 'Рекордная выручка за день', fm(p.best))}</div></div>` +
    `<div id="pmore">${r('Заработано всего', fm(p.earned))}${r('Продано чашек', p.cups)}${r('Репутация', p.rep)}${r('Локация', (DIST[p.district] || DIST[0]).name)}${r('Улучшений', p.upg)}` +
    (p.ranks ? r('Место по уровню', rk(p.ranks.level)) + r('Место по деньгам', rk(p.ranks.money)) + r('Место по рекорду дня', rk(p.ranks.best)) : '') +
    (p.created ? r('В игре с', new Date(p.created * 1000).toLocaleDateString('ru-RU')) : '') + '</div>';
  requestAnimationFrame(() => { pbase = $('phead').offsetHeight + 16 + pgrab.offsetHeight + 8; setP(pbase); });
}
setInterval(sync, 20000); setInterval(loadBoards, 30000);

// ---------- админ-панель (5 быстрых нажатий на название) ----------
const DEV_USERNAMES = ['imvtf'];
const isDev = !user || DEV_USERNAMES.includes(String(user.username || '').toLowerCase());
let devWasPaused = false, resetArm = false, taps = 0, tapT = 0;
$('brand').addEventListener('click', () => { if (!isDev) return; const n = performance.now(); taps = n - tapT < 600 ? taps + 1 : 1; tapT = n; if (taps >= 5) { taps = 0; openDev(); } });
const DEVG = [
  ['Деньги', [['+1k', 'm1k'], ['+10k', 'm10k'], ['+100k', 'm100k'], ['В ноль', 'm0']]],
  ['Заведение', [['Ур. +1', 'l+'], ['Ур. -1', 'l-'], ['Ур. MAX', 'lmax']]],
  ['Прокачка', [['Все улучшения', 'upmax'], ['Все локации', 'locs'], ['Нанять всех', 'staffmax']]],
  ['Склад', [['Заполнить', 'fill'], ['Опустошить', 'empty'], ['Молоко портится', 'spoil']]],
  ['Машина', [['Сломать', 'brk'], ['Починить', 'fix'], ['Вечная вкл/выкл', 'god']]],
  ['Игра', [['Конец дня', 'endday'], ['День +1', 'd+'], ['+5 клиентов', 'cust'], ['Очистить очередь', 'clr'], ['Репутация 100', 'rep']]],
  ['События', [['Дождь', 'ev_rain'], ['Туристы', 'ev_bus'], ['СЭС', 'ev_ses']]],
  ['Скорость игры', [['x1', 'sp1'], ['x2', 'sp2'], ['x4', 'sp4']]]
];
const DA = {
  m1k: () => S.money += 1000, m10k: () => S.money += 10000, m100k: () => S.money += 100000, m0: () => S.money = 0,
  setmoney: () => { const v = +$('devMoney').value; if (isFinite(v) && $('devMoney').value !== '') S.money = Math.max(0, v); },
  'l+': () => S.lvl = Math.min(LVL_MAX, S.lvl + 1), 'l-': () => S.lvl = Math.max(0, S.lvl - 1), lmax: () => S.lvl = LVL_MAX,
  upmax: () => ITEMS.forEach(x => S.lv[x.id] = x.max), locs: () => S.unl = S.unl.map(() => true), staffmax: () => STAFF.forEach(s => S.staff[s.id] = s.max),
  fill: () => { S.stock.beans = S.stock.milk = stockCap(); }, empty: () => { S.stock.beans = S.stock.milk = 0; }, spoil: () => EV.heat(),
  brk: () => breakMachine(), fix: () => { S.broken = false; }, god: () => { god = !god; toast(god ? 'Вечная машина и склад: вкл' : 'Вечная машина и склад: выкл'); },
  endday: () => { $('dev').hidden = true; paused = false; endDay(); return 'closed'; },
  'd+': () => S.day++, cust: () => spawn(5), clr: () => { customers = []; cooking = null; }, rep: () => S.rep = 100,
  ev_rain: () => EV.rain(), ev_bus: () => EV.bus(), ev_ses: () => EV.ses(),
  sp1: () => gameSpeed = 1, sp2: () => gameSpeed = 2, sp4: () => gameSpeed = 4
};
function renderDev() {
  $('dcard').innerHTML = `<h2>Админ-панель</h2><div class="mrow"><span>Деньги</span><b>${fm(S.money)}</b></div><div class="mrow"><span>Заведение</span><b>ур. ${S.lvl}, день ${S.day}</b></div><div class="mrow sub"><span>FPS ${Math.round(fps)}, скорость x${gameSpeed}</span><b>${god ? 'вечная вкл' : ''}</b></div>` +
    `<div class="dg">Задать деньги</div><div class="inrow"><input id="devMoney" type="number" inputmode="numeric" placeholder="сумма"><button data-dev="setmoney">Задать</button></div>` +
    DEVG.map(([n, bs]) => `<div class="dg">${n}</div><div class="drow">${bs.map(([l, a]) => `<button data-dev="${a}">${l}</button>`).join('')}</div>`).join('') +
    `<div class="dg">Опасная зона</div><div class="drow"><button data-dev="reset">${resetArm ? 'Точно сбросить?' : 'Сбросить прогресс'}</button></div><button class="on" data-dev="close">Закрыть</button>`;
}
function openDev() { devWasPaused = paused; paused = true; resetArm = false; renderDev(); $('dev').hidden = false; }
function devAction(a) {
  if (a === 'close') { $('dev').hidden = true; paused = devWasPaused; return; }
  if (a === 'reset') {
    if (!resetArm) { resetArm = true; renderDev(); return; }
    const keep = { set: S.set, name: S.name }; S = Object.assign(fresh(), keep); customers = []; cooking = null; dayT = 0; dayRev = dayCups = dayLost = dayBuy = 0; bgKey = '';
  } else if (DA[a]) { if (DA[a]() === 'closed') { save(); return; } }
  resetArm = false; bgKey = ''; save(); renderDev();
}

// ---------- сохранение ----------
function save() { const s = JSON.stringify(S); try { if (tg && tg.CloudStorage) tg.CloudStorage.setItem(SAVE_KEY, s); else localStorage.setItem(SAVE_KEY, s); } catch (e) {} }
function load() {
  return new Promise(res => {
    try {
      if (tg && tg.CloudStorage) tg.CloudStorage.getItem(SAVE_KEY, (err, v) => res(!err && v ? JSON.parse(v) : null));
      else { const v = localStorage.getItem(SAVE_KEY); res(v ? JSON.parse(v) : null); }
    } catch (e) { res(null); }
  });
}
setInterval(save, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
load().then(s => {
  if (s) { const f = fresh(); S = Object.assign(f, s, { lv: Object.assign(f.lv, s.lv), staff: Object.assign(f.staff, s.staff), stock: Object.assign(f.stock, s.stock), set: Object.assign(f.set, s.set), unl: f.unl.map((v, i) => s.unl && s.unl[i] !== undefined ? s.unl[i] : v) }); }
  applyTheme(); fit();
  if (!S.name) { paused = true; $('welcome').hidden = false; }
  loadBoards(); requestAnimationFrame(frame);
});
applyTheme();

// ---------- клики ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-act],[data-buy],[data-hire],[data-fire],[data-dist],[data-sup],[data-set],[data-dev],[data-cat],[data-bcat],[data-pid],[data-view]');
  if (!t) return;
  const d = t.dataset;
  if (d.view) { if (d.view === 'set') openView('set'); else openView(d.view); return; }
  if (d.cat) { cat = d.cat; renderShop(); return; }
  if (d.bcat) { bcat = d.bcat; renderBoard(); return; }
  if (d.pid) { openProfile(+d.pid); return; }
  if (d.dev) { devAction(d.dev); return; }
  if (d.set) { const [g, v] = d.set.split(','); if (g === 'haptic') S.set.haptic = v === '1'; else S.set[g] = v; if (g === 'theme') applyTheme(); if (g === 'q') fit(); save(); renderSet(); return; }
  if (d.act === 'welcome') { S.name = $('welIn').value.trim() || 'Моя кофейня'; $('welcome').hidden = true; paused = false; save(); return; }
  if (d.act === 'rename') { S.name = $('nameIn').value.trim() || S.name; save(); toast('Название сохранено'); return; }
  if (d.act === 'repair') { if (S.money >= repairCost()) { S.money -= repairCost(); S.broken = false; toast('Починено'); } else toast('Нет денег на ремонт'); return; }
  if (d.buy) {
    const cost = +t.dataset.cost;
    if (S.money < cost) return;
    S.money -= cost;
    if (d.buy === 'lvl') S.lvl++;
    else S.lv[d.buy]++;
    save(); renderShop(); toast('Куплено'); return;
  }
  if (d.hire) {
    const s = STAFF.find(x => x.id === d.hire), n = S.staff[d.hire], c = Math.round(s.hire * (1 + .6 * n));
    if (S.money >= c && staffTotal() < staffCap() && n < s.max) { S.money -= c; S.staff[d.hire]++; save(); renderShop(); toast('Нанят'); }
    return;
  }
  if (d.fire) { S.staff[d.fire] = Math.max(0, S.staff[d.fire] - 1); save(); renderShop(); return; }
  if (d.dist) {
    const i = +d.dist;
    if (S.unl[i]) { S.district = i; bgKey = ''; save(); renderShop(); toast('Локация: ' + DIST[i].name); }
    else if (S.money >= DIST[i].cost && S.lvl >= DIST[i].req) { S.money -= DIST[i].cost; S.unl[i] = true; S.district = i; bgKey = ''; save(); renderShop(); toast('Новая локация открыта'); }
    return;
  }
  if (d.sup) {
    const [id, q, c] = d.sup.split(',').map(Number);
    if (S.money >= c) { S.money -= c; S.stock[id] = Math.min(stockCap(), S.stock[id] + q); save(); updateSup(); updateShop(); }
    return;
  }
});

// ---------- тема и качество ----------
function applyTheme() {
  S.set.theme = 'dark';
  document.documentElement.dataset.theme = 'dark';
}
const cv = $('c'); let ctx = cv.getContext('2d');
const bgc = document.createElement('canvas'), bctx = bgc.getContext('2d');
let K = 1, bgKey = '';
function fit() {
  const cssW = cv.clientWidth || W, dpr = Math.min(window.devicePixelRatio || 1, QUAL[S.set.q] || 3);
  K = Math.max(.6, cssW * dpr / W);
  cv.width = bgc.width = Math.round(W * K); cv.height = bgc.height = Math.round(H * K); bgKey = '';
}
new ResizeObserver(fit).observe(cv);

</script>
</body>
